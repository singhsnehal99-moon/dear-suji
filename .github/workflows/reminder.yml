name: Dear Suji Reminder

on:
  schedule:
    - cron: "0 12 * * *"  # 8:00 PM Malaysia (MYT)
  workflow_dispatch:


jobs:
  remind:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord reminder
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "content":"🌙 Hi my puppy 🤍 Your little corner of the internet has been waiting for you. It only takes 2 minutes to check in. I love you endlessly🐶"
          }' \
          "${{ secrets.DISCORD_WEBHOOK }}"
