<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>See you tomorrow 🤍</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<style>
body{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
}

.thankyou{
  max-width:380px;
  text-align:center;
  background:white;
  padding:36px 28px;
  border-radius:28px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.dog{
  font-size:88px;
}

.quote{
  background:#FFF0F7;
  color:#DB2777;
  padding:16px;
  border-radius:18px;
  margin:22px 0;
  font-style:italic;
}

button{
  width:100%;
  border:none;
  border-radius:18px;
  padding:14px;
  background:#8B5CF6;
  color:white;
  font-family:Poppins;
  font-weight:600;
  cursor:pointer;
}
</style>

</head>

<body>

<div class="thankyou">

  <div class="dog">🐶</div>

  <h1 style="color:#8B5CF6;margin-top:12px;">
    Thank you, my puppy.
  </h1>

  <p style="margin-top:14px;color:#666;line-height:1.7;">
    Your little heart has been heard today.
    I'm so incredibly proud of you for checking in.
  </p>

  <div class="quote">
    “You never have to earn my love.
    I'll be here tomorrow too.” 🤍
  </div>

  <p style="margin-bottom:24px;font-weight:600;color:#7C3AED;">
    See you tomorrow at 8:00 PM 🌙
  </p>

  <button onclick="window.location.href='index.html'">
    Back to Dear Suji 🌸
  </button>

</div>

</body>
</html>
