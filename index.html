<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dear Suji 🌸</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <!-- Header -->
  <header class="header">
    <div class="flower">🌸</div>
    <h1>Dear Suji</h1>
    <p class="subtitle">Your little sanctuary.</p>
  </header>

  <!-- Tabs -->
  <nav class="tabs">
    <button id="journalBtn" class="tab active" type="button">
      Journal
    </button>

    <button id="dashboardBtn" class="tab" type="button">
      Dashboard
    </button>
  </nav>

  <!-- JOURNAL -->
  <main id="journalPage">

    <section class="card streak-card">
      <div class="streak">
        🐾 <span id="streakCount">0</span> Day Streak
      </div>
    </section>

    <section class="card">

      <label>How is your little heart feeling today?</label>

      <div class="mood-grid">

        <button class="mood-btn" data-mood="low" type="button">
          <span class="emoji">🌧️</span>
          <div>
            <strong>Rainy Cat</strong> <br>
            <small>Today feels heavy</small>
          </div>
        </button>

        <button class="mood-btn" data-mood="okay" type="button">
          <span class="emoji">☁️</span>
          <div>
            <strong>Sleepy Puppy</strong> <br>
            <small>I'm getting through today</small>
          </div>
        </button>

        <button class="mood-btn" data-mood="better" type="button">
          <span class="emoji">🌤️</span>
          <div>
            <strong>Zoomies Puppy</strong><br>
            <small>Today feels a little lighter</small>
          </div>
        </button>

      </div>

      <label>What do you need most?</label>

      <select id="need">
        <option value="" selected disabled>Select one...</option>
        <option value="Comfort">Comfort</option>
        <option value="Quiet company">Quiet company</option>
        <option value="Someone to listen">Someone to listen</option>
        <option value="Distraction">Distraction</option>
        <option value="Space">Space</option>
      </select>

      <label>Today's Tiny Wins ✨</label>

      <div class="check-grid">

        <label class="check-item">
          <input type="checkbox" value="Water">
          <span>💧 Drank water</span>
        </label>

        <label class="check-item">
          <input type="checkbox" value="Food">
          <span>🍖 Ate properly</span>
        </label>

        <label class="check-item">
          <input type="checkbox" value="Shower">
          <span>🚿 Showered</span>
        </label>

        <label class="check-item">
          <input type="checkbox" value="Outside">
          <span>🌳 Went outside</span>
        </label>

        <label class="check-item">
          <input type="checkbox" value="Social">
          <span>🐾 Spoke to someone</span>
        </label>
        
      <label class="check-item medication">
        <input id="meds" type="checkbox">
        <span>💊 Took my medication</span>
      </label>
      </div>

      <label>What felt hardest today?</label>

      <textarea
        id="hard"
        placeholder="You can write as much or as little as you'd like..."
      ></textarea>

      <label>One thing you're proud you survived 🌸</label>

      <textarea
        id="proud"
        placeholder="Even the smallest thing counts."
      ></textarea>

      <button id="submitBtn" class="primary" type="button">
        Send Paw Report 🐶
      </button>

    </section>

  </main>

  <!-- DASHBOARD -->
  <main id="dashboardPage" class="hidden">

    <section class="card">

      <div class="dashboard-title">
        <h2>📈 Mood Trend</h2>
        <p>Your journey, one day at a time.</p>
      </div>

      <canvas id="moodChart"></canvas>

    </section>

    <section class="card">

      <div class="dashboard-title">
        <h2>💊 Medication</h2>
        <h1 id="medRate">0%</h1>
      </div>

      <div class="progress">
        <div id="medBar" class="progress-fill"></div>
      </div>

      <p class="caption">Based on completed check-ins.</p>

    </section>

    <section class="card">

      <div class="dashboard-title">
        <h2>📅 This Month</h2>
      </div>

      <div class="calendar-head">
        <span>M</span>
        <span>T</span>
        <span>W</span>
        <span>T</span>
        <span>F</span>
        <span>S</span>
        <span>S</span>
      </div>

      <div id="calendar" class="calendar"></div>

      <p class="caption">
        🌧️ Rainy • ☁️ Sleepy • 🌤️ Zoomies
      </p>

    </section>

  </main>

  <footer class="footer">
    Made with endless love for my puppy 🤍
  </footer>

</div>

<!-- JavaScript -->
<script type="module" src="app.js"></scrip
